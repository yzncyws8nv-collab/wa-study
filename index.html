  border: "#1e293b", yellow: "#eab308",
  p1tag: "#3b82f6", p2tag: "#a855f7", p3tag: "#f59e0b", p4tag: "#ef4444",
};

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function ProgressBar({ current, total, label }) {
  const pct = total > 0 ? (current / total) * 100 : 0;
  return (
    <div style={{ marginBottom: 16 }}>
      {label && <div style={{ fontSize: 12, color: COLORS.textDim, marginBottom: 4 }}>{label}</div>}
      <div style={{ height: 6, background: COLORS.border, borderRadius: 3, overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${pct}%`, background: `linear-gradient(90deg, ${COLORS.accent}, #60a5fa)`, borderRadius: 3, transition: "width 0.4s ease" }} />
      </div>
    </div>
  );
}

function PhaseTag({ phase }) {
  const colors = { 1: ["rgba(59,130,246,0.15)", COLORS.p1tag], 2: ["rgba(168,85,247,0.15)", COLORS.p2tag], 3: ["rgba(245,158,11,0.15)", COLORS.p3tag], 4: ["rgba(239,68,68,0.15)", COLORS.p4tag] };
  const [bg, col] = colors[phase] || colors[1];
  return (
    <span style={{ fontSize: 9, fontWeight: 700, padding: "2px 6px", borderRadius: 4, background: bg, color: col, letterSpacing: 0.5 }}>
      P{phase}
    </span>
  );
}

function TopicCard({ topic, onClick, progress }) {
  const total = topic.quiz.length;
  const done = progress?.[topic.id] || 0;
  return (
    <button onClick={onClick} style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 12, cursor: "pointer", width: "100%", textAlign: "left", transition: "all 0.2s", color: COLORS.text, fontFamily: "inherit" }}
    onMouseEnter={e => { e.currentTarget.style.background = COLORS.cardHover; e.currentTarget.style.borderColor = COLORS.accent; }}
    onMouseLeave={e => { e.currentTarget.style.background = COLORS.card; e.currentTarget.style.borderColor = COLORS.border; }}>
      <span style={{ fontSize: 26, lineHeight: 1 }}>{topic.icon}</span>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 2 }}>
          <span style={{ fontWeight: 700, fontSize: 14 }}>{topic.title}</span>
          <PhaseTag phase={topic.phase} />
        </div>
        <div style={{ fontSize: 11, color: COLORS.textDim }}>{topic.items.length} facts · {total} quiz</div>
      </div>
      {done > 0 && (
        <span style={{ fontSize: 11, fontWeight: 600, padding: "3px 8px", borderRadius: 6, background: done >= total ? COLORS.correctBg : COLORS.accentGlow, color: done >= total ? COLORS.correct : COLORS.accent }}>{done >= total ? "✓" : `${done}/${total}`}</span>
      )}
    </button>
  );
}

function StudyView({ topic, onBack, onQuiz }) {
  const [idx, setIdx] = useState(0);
  const item = topic.items[idx];
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
        <button onClick={onBack} style={{ background: "none", border: "none", color: COLORS.accent, cursor: "pointer", fontSize: 20, padding: 0, fontFamily: "inherit" }}>←</button>
        <span style={{ fontSize: 22 }}>{topic.icon}</span>
        <span style={{ fontWeight: 700, fontSize: 16, color: COLORS.text }}>{topic.title}</span>
        <PhaseTag phase={topic.phase} />
      </div>
      <ProgressBar current={idx + 1} total={topic.items.length} label={`${idx + 1} / ${topic.items.length}`} />
      <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 14, padding: "20px 18px", marginBottom: 16 }}>
        <div style={{ fontSize: 15, lineHeight: 1.7, color: COLORS.text, marginBottom: 12 }}>{item.en}</div>
        <div style={{ fontSize: 14, lineHeight: 1.7, color: COLORS.accent, borderTop: `1px solid ${COLORS.border}`, paddingTop: 10 }}>{item.kr}</div>
      </div>
      <div style={{ display: "flex", gap: 10 }}>
        <button disabled={idx === 0} onClick={() => setIdx(i => i - 1)}
          style={{ flex: 1, padding: "12px 0", borderRadius: 10, border: `1px solid ${COLORS.border}`, background: COLORS.card, color: idx === 0 ? COLORS.textMuted : COLORS.text, cursor: idx === 0 ? "default" : "pointer", fontWeight: 600, fontSize: 14, fontFamily: "inherit" }}>← Prev</button>
        {idx < topic.items.length - 1 ? (
          <button onClick={() => setIdx(i => i + 1)}
            style={{ flex: 1, padding: "12px 0", borderRadius: 10, border: "none", background: COLORS.accent, color: "#fff", cursor: "pointer", fontWeight: 600, fontSize: 14, fontFamily: "inherit" }}>Next →</button>
        ) : (
          <button onClick={onQuiz}
            style={{ flex: 1, padding: "12px 0", borderRadius: 10, border: "none", background: `linear-gradient(135deg, ${COLORS.accent}, #8b5cf6)`, color: "#fff", cursor: "pointer", fontWeight: 700, fontSize: 14, fontFamily: "inherit" }}>🎯 Quiz 퀴즈</button>
        )}
      </div>
    </div>
  );
}

function QuizEngine({ questions, title, onBack, onComplete, totalLabel }) {
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const q = questions[idx];
  const isCorrect = selected === q?.ans;

  const handleSelect = (i) => { if (selected !== null) return; setSelected(i); if (i === q.ans) setScore(s => s + 1); };
  const handleNext = () => {
    if (idx + 1 >= questions.length) { setDone(true); if (onComplete) onComplete(score + (isCorrect ? 0 : 0)); }
    else { setIdx(i => i + 1); setSelected(null); }
  };

  if (done) {
    const pct = Math.round((score / questions.length) * 100);
    const passed = pct >= 80;
    return (
      <div style={{ textAlign: "center", padding: "30px 0" }}>
        <div style={{ fontSize: 48, marginBottom: 12 }}>{passed ? "🎉" : "📚"}</div>
        <div style={{ fontSize: 22, fontWeight: 700, color: COLORS.text, marginBottom: 6 }}>{passed ? "PASSED! 합격!" : "Keep studying! 더 공부하자!"}</div>
        <div style={{ fontSize: 36, fontWeight: 800, color: passed ? COLORS.correct : COLORS.yellow }}>{score} / {questions.length}</div>
        <div style={{ fontSize: 14, color: COLORS.textDim, marginBottom: 24 }}>{pct}% · Pass: 80%</div>
        <button onClick={onBack} style={{ padding: "12px 24px", borderRadius: 10, border: `1px solid ${COLORS.border}`, background: COLORS.card, color: COLORS.text, cursor: "pointer", fontWeight: 600, fontSize: 14, fontFamily: "inherit" }}>← Home 홈으로</button>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
        <button onClick={onBack} style={{ background: "none", border: "none", color: COLORS.accent, cursor: "pointer", fontSize: 20, padding: 0, fontFamily: "inherit" }}>←</button>
        <span style={{ fontWeight: 700, fontSize: 15, color: COLORS.text }}>{title}</span>
        {totalLabel && <span style={{ marginLeft: "auto", fontSize: 12, color: COLORS.textDim, background: COLORS.card, padding: "4px 10px", borderRadius: 6 }}>{totalLabel}: {score}/{idx + (selected !== null ? 1 : 0)}</span>}
      </div>
      <ProgressBar current={idx + 1} total={questions.length} label={`${idx + 1} / ${questions.length}${q.topic ? ` · ${q.topic}` : ""}`} />
      <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 14, padding: "18px 16px", marginBottom: 12 }}>
        <div style={{ fontSize: 15, fontWeight: 600, lineHeight: 1.6, color: COLORS.text, marginBottom: 4 }}>{q.q}</div>
        <div style={{ fontSize: 13, lineHeight: 1.5, color: COLORS.accent }}>{q.qk}</div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
        {q.opts.map((opt, i) => {
          let bg = COLORS.card, brd = COLORS.border, col = COLORS.text;
          if (selected !== null) {
            if (i === q.ans) { bg = COLORS.correctBg; brd = COLORS.correct; col = COLORS.correct; }
            else if (i === selected) { bg = COLORS.wrongBg; brd = COLORS.wrong; col = COLORS.wrong; }
          }
          return (<button key={i} onClick={() => handleSelect(i)} style={{ padding: "13px 14px", borderRadius: 10, border: `1.5px solid ${brd}`, background: bg, color: col, cursor: selected !== null ? "default" : "pointer", fontWeight: 600, fontSize: 14, textAlign: "left", fontFamily: "inherit", transition: "all 0.15s" }}>
            <span style={{ marginRight: 10, opacity: 0.5 }}>{String.fromCharCode(65 + i)}</span>{opt}
          </button>);
        })}
      </div>
      {selected !== null && (
        <div style={{ background: isCorrect ? COLORS.correctBg : COLORS.wrongBg, border: `1px solid ${isCorrect ? COLORS.correct : COLORS.wrong}`, borderRadius: 10, padding: "12px 14px", marginBottom: 12 }}>
          <div style={{ fontWeight: 700, fontSize: 13, color: isCorrect ? COLORS.correct : COLORS.wrong, marginBottom: 3 }}>{isCorrect ? "✓ Correct! 정답!" : "✗ Incorrect 오답"}</div>
          <div style={{ fontSize: 13, lineHeight: 1.5, color: COLORS.text }}>{q.exp}</div>
          <div style={{ fontSize: 12, lineHeight: 1.5, color: COLORS.accent, marginTop: 2 }}>{q.expk}</div>
        </div>
      )}
      {selected !== null && (
        <button onClick={handleNext} style={{ width: "100%", padding: "13px 0", borderRadius: 10, border: "none", background: COLORS.accent, color: "#fff", cursor: "pointer", fontWeight: 700, fontSize: 14, fontFamily: "inherit" }}>
          {idx + 1 >= questions.length ? "Results 결과" : "Next 다음 →"}
        </button>
      )}
    </div>
  );
}

const App = function App() {
  const [view, setView] = useState("home");
  const [topicId, setTopicId] = useState(null);
  const [progress, setProgress] = useState({});
  const [phaseFilter, setPhaseFilter] = useState(0);

  const topic = STUDY_DATA.find(t => t.id === topicId);
  const filtered = phaseFilter === 0 ? STUDY_DATA : STUDY_DATA.filter(t => t.phase === phaseFilter);

  const handleQuizComplete = useCallback((tid, score) => {
    setProgress(p => ({ ...p, [tid]: Math.max(p[tid] || 0, score) }));
  }, []);

  const totalQuiz = STUDY_DATA.reduce((s, t) => s + t.quiz.length, 0);
  const totalDone = Object.values(progress).reduce((s, v) => s + v, 0);

  const mockQuestions = useMemo(() => {
    const pool = STUDY_DATA.flatMap(t => t.quiz.map(q => ({ ...q, topic: t.title })));
    return shuffleArray(pool).slice(0, 30);
  }, []);

  const topicQuestions = useMemo(() => {
    if (!topic) return [];
    return shuffleArray(topic.quiz);
  }, [topicId]);

  const wrap = (children) => (
    <div style={{ maxWidth: 520, margin: "0 auto", padding: "20px 16px", fontFamily: "'Segoe UI', system-ui, sans-serif", color: COLORS.text, background: COLORS.bg, minHeight: "100vh" }}>
      {children}
    </div>
  );

  if (view === "keynums") return wrap(<KeyNumbers onBack={() => setView("home")} />);

  if (view === "mock") return wrap(
    <QuizEngine questions={mockQuestions} title="🏁 Mock Exam 모의시험" onBack={() => setView("home")} totalLabel="Score 점수" />
  );

  if (view === "quiz" && topic) return wrap(
    <QuizEngine questions={topicQuestions} title={`🎯 ${topic.title}`} onBack={() => setView("home")}
      onComplete={(s) => handleQuizComplete(topic.id, s)} />
  );

  if (view === "study" && topic) return wrap(
    <StudyView topic={topic} onBack={() => setView("home")} onQuiz={() => setView("quiz")} />
  );

  return (
    <div style={{ maxWidth: 520, margin: "0 auto", padding: "20px 16px", fontFamily: "'Segoe UI', system-ui, sans-serif", color: COLORS.text, background: COLORS.bg, minHeight: "100vh" }}>
      <div style={{ textAlign: "center", marginBottom: 20 }}>
        <div style={{ fontSize: 13, fontWeight: 700, letterSpacing: 3, color: COLORS.accent, marginBottom: 3 }}>DRIVE SAFE WA</div>
        <div style={{ fontSize: 21, fontWeight: 800, color: COLORS.text, marginBottom: 2 }}>Learner's Permit Study</div>
        <div style={{ fontSize: 12, color: COLORS.textDim }}>초보운전 면허 시험 준비 · {STUDY_DATA.length} topics · {totalQuiz} questions</div>
      </div>

      <ProgressBar current={totalDone} total={totalQuiz} label={`Overall 전체: ${totalDone}/${totalQuiz}`} />

      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <button onClick={() => setView("mock")} style={{ flex: 1, padding: "13px 0", borderRadius: 10, border: "none", background: `linear-gradient(135deg, ${COLORS.accent}, #8b5cf6)`, color: "#fff", cursor: "pointer", fontWeight: 700, fontSize: 14, fontFamily: "inherit" }}>
          🏁 Mock Exam 모의시험
        </button>
        <button onClick={() => setView("keynums")} style={{ flex: 1, padding: "13px 0", borderRadius: 10, border: `1px solid ${COLORS.border}`, background: COLORS.card, color: COLORS.text, cursor: "pointer", fontWeight: 700, fontSize: 14, fontFamily: "inherit" }}>
          🔢 Key Numbers
        </button>
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
        {[{ v: 0, l: "All 전체" }, { v: 1, l: "P1" }, { v: 2, l: "P2" }, { v: 3, l: "P3" }, { v: 4, l: "P4" }].map(f => (
          <button key={f.v} onClick={() => setPhaseFilter(f.v)} style={{
            padding: "7px 14px", borderRadius: 8, border: `1px solid ${phaseFilter === f.v ? COLORS.accent : COLORS.border}`,
            background: phaseFilter === f.v ? COLORS.accentGlow : COLORS.card,
            color: phaseFilter === f.v ? COLORS.accent : COLORS.textDim,
            cursor: "pointer", fontWeight: 600, fontSize: 12, fontFamily: "inherit",
          }}>{f.l}</button>
        ))}
        <span style={{ marginLeft: "auto", alignSelf: "center", fontSize: 11, color: COLORS.textMuted }}>{filtered.length} topics</span>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {filtered.map(t => (
          <TopicCard key={t.id} topic={t} progress={progress} onClick={() => { setTopicId(t.id); setView("study"); }} />
        ))}
      </div>

      <div style={{ textAlign: "center", marginTop: 24, fontSize: 10, color: COLORS.textMuted, lineHeight: 1.5 }}>
        Based on WA Drive Safe Handbook (Feb 2026)<br/>Dept of Transport and Major Infrastructure<br/>
        <a href="https://www.transport.wa.gov.au/licensing/road-rules-theory-test-quiz.asp" target="_blank" rel="noopener" style={{ color: COLORS.accent, textDecoration: "none", fontWeight: 600 }}>
          🔗 Official WA Practice Quiz 공식 연습 퀴즈
        </a>
      </div>
    </div>
  );
}
